# Builds the Sphinx documentation on every push and publishes it to GitHub Pages.
#
# Pages from a private repository needs a paid plan, which is why this published nothing while the
# repository was private. It is public now, so the deploy job below is live and the site is the
# documentation's real home rather than an artifact someone has to know to download.
#
# No ROS is installed. `docs/conf.py` mocks rclpy and the interface packages, which works only
# because the library keeps its ROS imports in one module and resolves `Recorder` lazily. That is
# the difference between a thirty-second docs job and a ten-minute one.

name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      # -W turns warnings into errors, which is the point: a broken cross-reference or a docstring
      # autodoc cannot import is a defect, and one that is easy to miss in a wall of build output.
      # --keep-going reports every one of them rather than stopping at the first.
      - name: Build
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      # The Pages-flavoured upload rather than the plain one: it tars the directory in the
      # layout deploy-pages expects. It is still a downloadable artifact on pull requests, which
      # do not deploy.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    # Only main publishes. A pull request still builds the docs -- that is the check that matters
    # on a PR -- but deploying one would put unreviewed content on the public site, and a PR from
    # a fork cannot get the token to do it anyway.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deployments are not cancelled half-way. The workflow-level group cancels superseded builds,
    # which is right for a build and wrong for a publish: an interrupted one can leave the live
    # site mid-update.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
