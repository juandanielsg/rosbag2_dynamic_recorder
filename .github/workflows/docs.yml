# Builds the Sphinx documentation on every push and keeps the HTML as a downloadable artifact.
#
# It deliberately does NOT publish. GitHub Pages from a private repository needs a paid plan, and
# this repository is private by choice, so publishing is a decision to take rather than a default
# to inherit. The `pages` job at the bottom is commented out and is the whole of what turning it
# on requires -- plus setting Settings > Pages > Source to "GitHub Actions".
#
# No ROS is installed. `docs/conf.py` mocks rclpy and the interface packages, which works only
# because the library keeps its ROS imports in one module and resolves `Recorder` lazily. That is
# the difference between a thirty-second docs job and a ten-minute one.

name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      # -W turns warnings into errors, which is the point: a broken cross-reference or a docstring
      # autodoc cannot import is a defect, and one that is easy to miss in a wall of build output.
      # --keep-going reports every one of them rather than stopping at the first.
      - name: Build
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 30

# To publish to GitHub Pages instead of only keeping the artifact:
#   1. Settings > Pages > Source: "GitHub Actions"
#   2. add `pages: write` and `id-token: write` to the permissions block above
#   3. uncomment this job, and swap upload-artifact for actions/upload-pages-artifact@v3 above
#
# Note that a private repository needs GitHub Pro, Team or Enterprise for Pages to be available at
# all. On a Free plan the deploy step fails with a plan error, and the repository has to be public.
