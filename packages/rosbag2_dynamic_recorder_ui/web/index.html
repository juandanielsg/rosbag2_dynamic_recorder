<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recorder</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --card: #fff; --fg: #14171a; --muted: #5b6570; --line: #dfe3e8;
    --ok: #17803d; --warn: #9a6700; --bad: #b42318; --idle: #5b6570; --accent: #1f6feb;
    --track: #e6e9ee; --band: rgba(154, 103, 0, .16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a; --card: #1c2024; --fg: #e8eaed; --muted: #9aa4af; --line: #2c3238;
      --ok: #3fb950; --warn: #d29922; --bad: #f85149; --idle: #9aa4af; --accent: #58a6ff;
      --track: #262c33; --band: rgba(210, 153, 34, .18);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 20px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px; margin-bottom: 16px; }

  .health { display: flex; align-items: center; gap: 12px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--idle); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }
  .health-text { font-size: 17px; font-weight: 600; }
  .health-note { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
           gap: 12px; margin-top: 16px; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 17px; font-variant-numeric: tabular-nums; }
  .stat .v.unknown { color: var(--warn); font-size: 15px; }

  button { font: inherit; padding: 8px 14px; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }

  ul.topics { list-style: none; margin: 0; padding: 0;
              max-height: 320px; overflow-y: auto; }
  ul.topics li { border-bottom: 1px solid var(--line); }
  ul.topics li:last-child { border-bottom: 0; }
  ul.topics label { display: flex; align-items: center; gap: 10px; padding: 8px 2px;
                    cursor: pointer; }
  ul.topics input { width: 17px; height: 17px; flex: none; cursor: pointer; }
  .name { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 13px; }
  .tag { margin-left: auto; font-size: 11px; color: var(--muted); }

  .profiles { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  button.active { background: var(--ok); border-color: var(--ok); color: #fff; }

  .apply-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .pending { color: var(--muted); font-size: 13px; }

  table.detail { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.detail td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.detail td:first-child { color: var(--muted); width: 45%; }
  table.detail .caveat { color: var(--muted); font-size: 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }

  ol.events { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  ol.events li { padding: 6px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
  ol.events li:last-child { border-bottom: 0; }
  .ev-sub, .ev-resumed { color: var(--ok); } .ev-unsub, .ev-paused { color: var(--warn); }
  .ev-all { font-style: italic; }
  .reason { color: var(--muted); margin-left: auto; font-size: 12px; }
  .empty { color: var(--muted); font-size: 13px; }
  /* Timeline: one row per topic that has ever been recorded, drawn on the recorder's clock. */
  .tl { display: grid; grid-template-columns: minmax(96px, max-content) 1fr;
        gap: 4px 12px; align-items: center; }
  .tl-name { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
             font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .tl-track { position: relative; height: 16px; background: var(--track); border-radius: 3px;
              overflow: hidden; }
  .tl-seg { position: absolute; top: 0; bottom: 0; background: var(--accent); opacity: .85; }
  .tl-band { position: absolute; top: 0; bottom: 0; background: var(--band); }
  .tl-unseen { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(
                 -45deg, var(--line) 0 4px, transparent 4px 8px); }
  .tl-axis { grid-column: 2; display: flex; justify-content: space-between; color: var(--muted);
             font-size: 11px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: 12px;
            color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 22px; height: 10px; border-radius: 2px; display: inline-block; }

  /* Filter bar over the topic picker. */
  .filterbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .filterbar input[type="search"] { flex: 1 1 200px; min-width: 0; font: inherit; padding: 7px 11px;
      border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  .filterbar input[type="search"].bad { border-color: var(--bad); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 7px 12px; font-size: 13px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent);
                                     color: #fff; }
  .topics { max-height: 300px; overflow-y: auto; }
  .topics mark { background: transparent; color: var(--accent); font-weight: 600; }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  .hint.bad { color: var(--bad); }

  #toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px;
           background: var(--card); border: 1px solid var(--line); border-radius: 8px;
           padding: 10px 16px; font-size: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
</style>
</head>
<body>
<main>
  <h1>Recording</h1>
  <div class="sub" id="target">connecting…</div>

  <div class="card">
    <div class="health">
      <span class="dot" id="dot"></span>
      <div>
        <div class="health-text" id="health">Looking for the recorder…</div>
        <div class="health-note" id="health-note"></div>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="card">
    <h2>Controls</h2>
    <div class="controls">
      <button id="btn-record" hidden>Start recording</button>
      <button id="btn-pause">Pause</button>
      <button id="btn-split">Start a new file</button>
      <button id="btn-snapshot">Save snapshot</button>
      <button id="btn-stop">Stop recording</button>
    </div>
  </div>

  <div class="card" id="profiles-card" hidden>
    <h2>Profiles</h2>
    <div class="profiles" id="profiles"></div>
    <div class="pending" id="profile-note"></div>
  </div>

  <div class="card" id="timeline-card" hidden>
    <h2>Recording timeline</h2>
    <div class="tl" id="tl"></div>
    <div class="legend">
      <span><i class="swatch" style="background:var(--accent);opacity:.85"></i> recorded</span>
      <span><i class="swatch" style="background:var(--track)"></i> not recorded</span>
      <span><i class="swatch" style="background:var(--band)"></i> paused, every topic at once</span>
    </div>
    <p class="hint" id="tl-note"></p>
  </div>

  <div class="card">
    <h2>Topics</h2>
    <div class="filterbar">
      <input type="search" id="filter" placeholder="Filter topics…" autocomplete="off"
             aria-label="Filter topics">
      <div class="seg" role="group" aria-label="Filter mode">
        <button id="mode-text" aria-pressed="true">Text</button>
        <button id="mode-regex" aria-pressed="false">Regex</button>
      </div>
      <button id="btn-match" disabled>Record all matching</button>
    </div>
    <ul class="topics" id="topics"><li class="empty">Waiting for topics…</li></ul>
    <div class="apply-row">
      <button class="primary" id="btn-apply" disabled>Apply changes</button>
      <span class="pending" id="pending"></span>
    </div>
    <p class="hint" id="filter-hint"></p>
  </div>

  <div class="card">
    <h2>Recent changes</h2>
    <ol class="events" id="events"><li class="empty">Nothing yet.</li></ol>
  </div>

  <details class="card">
    <summary>Details</summary>
    <table class="detail" id="detail"></table>
  </details>
</main>

<script>
"use strict";
// Checkboxes the user has touched but not yet applied. Kept separate from server state so a
// poll landing mid-edit cannot silently revert what someone just clicked.
let pending = null;
let state = null;
let busy = false;

const $ = (id) => document.getElementById(id);
const fmtInt = (n) => n.toLocaleString();
const esc = (t) => t.replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// mm:ss, so the axis ticks line up as a column of equal-width labels.
function clock(seconds) {
  const whole = Math.max(0, Math.round(seconds));
  return `${Math.floor(whole / 60)}:${String(whole % 60).padStart(2, "0")}`;
}

function fmtDuration(s) {
  s = Math.floor(s || 0);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}h ${m}m` : (m ? `${m}m ${s % 60}s` : `${s}s`);
}

function fmtBytes(b) {
  if (!b) return "0 B";
  const u = ["B", "KB", "MB", "GB", "TB"];
  const i = Math.min(Math.floor(Math.log(b) / Math.log(1024)), u.length - 1);
  return `${(b / Math.pow(1024, i)).toFixed(i ? 1 : 0)} ${u[i]}`;
}

function toast(text) {
  let el = $("toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; document.body.appendChild(el); }
  el.textContent = text;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.remove(), 4000);
}

// Deliberately conservative. Anything we cannot substantiate is reported as unknown rather than
// shown as a reassuring zero -- messages have been observed missing from a bag while the
// transport reported no loss at all.
function health(s) {
  if (!s.connected) {
    return { cls: "", text: "No recorder found",
             note: `Nothing is publishing ${s.recorder}/status. Is the recorder running?` };
  }
  if (s.stale) {
    return { cls: "bad", text: "Lost contact with the recorder",
             note: "No status update for several seconds." };
  }
  if (!s.recording) {
    return { cls: "", text: "Stopped",
             note: "The bag is closed. Starting again opens a new one and restores the same " +
                   "topics." };
  }
  if (s.paused) {
    return { cls: "warn", text: "Paused",
             note: "Subscriptions are still up; messages are arriving but not being written." };
  }
  if (s.write_errors > 0) {
    return { cls: "bad", text: `Recording — ${fmtInt(s.write_errors)} messages could not be written`,
             note: "These reached the recorder but failed to reach the bag; a full disk is the " +
                   "usual cause. The recording is incomplete and is still running." };
  }
  if (s.messages_missed === null) {
    return { cls: "warn", text: "Recording — loss cannot be measured",
             note: "This middleware does not supply publication sequence numbers, so missing " +
                   "messages cannot be detected. Absence of a warning is not evidence of none." };
  }
  if (s.messages_missed > 0) {
    return { cls: "bad", text: `Recording — ${fmtInt(s.messages_missed)} messages missing`,
             note: "Detected from gaps in publisher sequence numbers." };
  }
  return { cls: "ok", text: "Recording", note: "No missing messages detected." };
}

function renderStats(s) {
  const missed = s.messages_missed === null
    ? '<div class="v unknown">unknown</div>'
    : `<div class="v">${fmtInt(s.messages_missed)}</div>`;
  $("stats").innerHTML = `
    <div class="stat"><div class="k">Recorded</div><div class="v">${fmtInt(s.messages_written)}</div></div>
    <div class="stat"><div class="k">Missing</div>${missed}</div>
    <div class="stat"><div class="k">Running for</div><div class="v">${fmtDuration(s.elapsed_seconds)}</div></div>
    <div class="stat"><div class="k">Topics</div><div class="v">${s.subscribed_topics.length}</div></div>
    <div class="stat"><div class="k">On disk</div><div class="v">${fmtBytes(s.bag_size_bytes)}</div></div>`;
}

function renderTopics(s) {
  const recorded = new Set(s.subscribed_topics);
  const checked = pending || recorded;
  const list = s.available_topics.slice();
  // A topic can be recorded after its publisher goes away; keep showing it or it would vanish
  // from the UI while still in the bag.
  for (const t of recorded) if (!list.includes(t)) list.push(t);
  list.sort();

  if (!list.length) {
    $("topics").innerHTML = '<li class="empty">No topics are being published yet.</li>';
    renderFilterHint(s, 0, 0, matcher());
    return;
  }
  const m = matcher();
  const shown = list.filter((t) => m.test(t));
  renderFilterHint(s, list.length, shown.length, m);

  if (!shown.length) {
    $("topics").innerHTML =
      '<li class="empty">Nothing matches that filter.</li>';
    return;
  }
  $("topics").innerHTML = shown.map((t) => {
    const off = !s.available_topics.includes(t);
    return `<li><label>
      <input type="checkbox" data-topic="${esc(t)}" ${checked.has(t) ? "checked" : ""}>
      <span class="name">${highlighted(t, m.mark)}</span>
      ${off ? '<span class="tag">publisher gone</span>' : ""}
    </label></li>`;
  }).join("");

  for (const box of $("topics").querySelectorAll("input")) {
    box.addEventListener("change", () => {
      if (!pending) pending = new Set(recorded);
      box.checked ? pending.add(box.dataset.topic) : pending.delete(box.dataset.topic);
      renderPending(recorded);
    });
  }
  renderPending(recorded);
}

function renderPending(recorded) {
  if (!pending) { $("btn-apply").disabled = true; $("pending").textContent = ""; return; }
  const add = [...pending].filter((t) => !recorded.has(t));
  const rem = [...recorded].filter((t) => !pending.has(t));
  if (!add.length && !rem.length) {
    pending = null;
    $("btn-apply").disabled = true;
    $("pending").textContent = "";
    return;
  }
  $("btn-apply").disabled = false;
  const bits = [];
  if (add.length) bits.push(`add ${add.length}`);
  if (rem.length) bits.push(`remove ${rem.length}`);
  $("pending").textContent = bits.join(", ") +
    " — topics you did not change keep recording without a gap";
}

function renderProfiles(s) {
  const list = s.profiles || [];
  $("profiles-card").hidden = list.length === 0;
  if (!list.length) return;

  $("profiles").innerHTML = list.map((p) => {
    const on = p.name === s.active_profile;
    return `<button class="${on ? "active" : ""}" data-profile="${p.name}"
      title="${p.topics.join("\n")}" ${on || !s.recording ? "disabled" : ""}>${p.name}</button>`;
  }).join("");

  for (const btn of $("profiles").querySelectorAll("button[data-profile]")) {
    btn.onclick = async () => {
      const out = await act("set_profile", { name: btn.dataset.profile });
      if (out.ok) { pending = null; toast(`Switched to ${btn.dataset.profile}.`); }
    };
  }
  $("profile-note").textContent = s.active_profile
    ? `Recording the "${s.active_profile}" profile.`
    : "The current selection does not match a profile.";
}

// --- filter over the topic picker -------------------------------------------
// Text mode narrows the list locally. Regex mode does the same, and additionally lets the pattern
// be handed to the recorder as one set_topics call instead of ticking boxes.
let filterMode = "text";

function matcher() {
  const query = $("filter").value.trim();
  if (!query) return { query, test: () => true, ok: true, mark: null };
  if (filterMode === "text") {
    const q = query.toLowerCase();
    return { query, test: (n) => n.toLowerCase().includes(q), ok: true, mark: q };
  }
  try {
    const re = new RegExp(query);
    return { query, test: (n) => re.test(n), ok: true, mark: re };
  } catch (err) {
    // Show everything rather than nothing: a half-typed expression should not look like a
    // pattern that legitimately matched no topics, which is the same distinction the recorder
    // makes when it refuses an invalid one.
    return { query, test: () => true, ok: false, mark: null };
  }
}

function highlighted(name, mark) {
  if (!mark) return esc(name);
  const re = mark instanceof RegExp
    ? mark : new RegExp(mark.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
  const hit = name.match(re);
  if (!hit || !hit[0]) return esc(name);
  const at = name.indexOf(hit[0]);
  return esc(name.slice(0, at)) + "<mark>" + esc(hit[0]) + "</mark>" +
         esc(name.slice(at + hit[0].length));
}

function renderFilterHint(s, total, shown, m) {
  const hint = $("filter-hint");
  hint.classList.toggle("bad", !m.ok);
  const canMatch = filterMode === "regex" && m.query && m.ok && shown > 0 && s.recording;
  $("btn-match").disabled = !canMatch;
  $("btn-match").textContent = canMatch
    ? `Record all ${shown} matching` : "Record all matching";

  if (!m.ok) { hint.textContent = "Not a valid regular expression."; return; }
  if (!m.query) { hint.textContent = ""; return; }
  hint.textContent = filterMode === "regex"
    ? `Sent as set_topics {regex: "${m.query}"} — one call, nothing to enumerate.`
    : `Showing ${shown} of ${total}. Switch to Regex to send the pattern to the recorder.`;
}

// --- timeline ----------------------------------------------------------------
function renderTimeline(s) {
  const card = $("timeline-card");
  const history = s.history || [];
  const span = s.connected ? s.elapsed_seconds : 0;
  if (!s.connected || !history.length || !(span > 0)) { card.hidden = true; return; }

  const t0 = s.recording_started;
  const t1 = t0 + span;
  // The recorder retains only ten events for a client that connects late, so anything before the
  // oldest one we hold was simply not observed. The chart says so rather than drawing a bar it
  // cannot vouch for -- the same rule as reporting unknown instead of zero.
  const seenFrom = Math.max(t0, Math.min(history[0].stamp, t1));

  const spans = new Map();
  const open = new Map();
  const pauses = [];
  let pausedAt = null;
  const add = (topic, from, to) => {
    if (!(to > from)) return;
    if (!spans.has(topic)) spans.set(topic, []);
    spans.get(topic).push([from, to]);
  };

  for (const e of history) {
    if (e.kind === "pause") {
      if (e.action === "paused") { if (pausedAt === null) pausedAt = e.stamp; }
      else if (pausedAt !== null) { pauses.push([pausedAt, e.stamp]); pausedAt = null; }
      continue;
    }
    if (e.action === "subscribed") {
      if (!open.has(e.topic)) open.set(e.topic, e.stamp);
    } else {
      add(e.topic, open.has(e.topic) ? open.get(e.topic) : seenFrom, e.stamp);
      open.delete(e.topic);
    }
  }
  if (pausedAt !== null) pauses.push([pausedAt, t1]);
  for (const [topic, from] of open) add(topic, from, t1);
  // Recorded now but never announced within the history we hold: it started before we were
  // watching, so its bar begins where our knowledge does.
  for (const topic of s.subscribed_topics) if (!spans.has(topic)) add(topic, seenFrom, t1);

  const rows = [...spans.keys()].sort();
  if (!rows.length) { card.hidden = true; return; }

  const at = (t) => ((t - t0) / span) * 100;
  const tl = $("tl");
  tl.textContent = "";
  for (const topic of rows) {
    const name = document.createElement("div");
    name.className = "tl-name";
    name.textContent = topic;
    name.title = topic;
    const track = document.createElement("div");
    track.className = "tl-track";
    if (seenFrom > t0 + 0.5) {
      const unseen = document.createElement("div");
      unseen.className = "tl-unseen";
      unseen.style.left = "0%";
      unseen.style.width = at(seenFrom) + "%";
      track.appendChild(unseen);
    }
    for (const [from, to] of spans.get(topic)) {
      const seg = document.createElement("div");
      seg.className = "tl-seg";
      seg.style.left = at(from) + "%";
      seg.style.width = (at(to) - at(from)) + "%";
      track.appendChild(seg);
    }
    for (const [from, to] of pauses) {
      const band = document.createElement("div");
      band.className = "tl-band";
      band.style.left = at(from) + "%";
      band.style.width = (at(to) - at(from)) + "%";
      band.title = "paused";
      track.appendChild(band);
    }
    tl.append(name, track);
  }

  const axis = document.createElement("div");
  axis.className = "tl-axis";
  for (const f of [0, 0.25, 0.5, 0.75, 1]) {
    const tick = document.createElement("span");
    tick.textContent = clock(f * span);
    axis.appendChild(tick);
  }
  tl.appendChild(axis);

  $("tl-note").textContent = seenFrom > t0 + 0.5
    ? "Hatched: before this page connected. The recorder keeps only its ten most recent events " +
      "for a client that joins late, so what happened earlier was not observed."
    : "";
  card.hidden = false;
}

function renderEvents(s) {
  if (!s.events.length) { $("events").innerHTML = '<li class="empty">Nothing yet.</li>'; return; }
  $("events").innerHTML = s.events.map((e) => {
    // A pause has no topic because it stops every one of them. Saying "all topics" is the
    // honest label, and the distinction is the whole reason the two event kinds are separate.
    if (e.kind === "pause") {
      return `
    <li>
      <span class="ev-${e.action}">${e.action}</span>
      <span class="name ev-all">all topics</span>
      <span class="reason">${e.reason}</span>
    </li>`;
    }
    return `
    <li>
      <span class="${e.action === "subscribed" ? "ev-sub" : "ev-unsub"}">
        ${e.action === "subscribed" ? "added" : "removed"}</span>
      <span class="name">${e.topic}</span>
      <span class="reason">${e.reason}</span>
    </li>`;
  }).join("");
}

function renderDetail(s) {
  const missed = s.messages_missed === null
    ? '<span class="v unknown">unknown</span><div class="caveat">The middleware does not supply publication sequence numbers here, so this cannot be measured. Not the same as zero.</div>'
    : `${fmtInt(s.messages_missed)}<div class="caveat">Counted from gaps in each publisher's sequence numbers. Independent of whether the transport reported anything.</div>`;
  $("detail").innerHTML = `
    <tr><td>Bag</td><td class="name">${s.uri || "—"}</td></tr>
    <tr><td>Storage</td><td>${s.storage_id || "—"}</td></tr>
    <tr><td>Messages recorded</td><td>${fmtInt(s.messages_written)}</td></tr>
    <tr><td>Messages missing</td><td>${missed}</td></tr>
    <tr><td>Failed writes</td><td>${fmtInt(s.write_errors)}
      <div class="caveat">Messages that arrived but could not be written, usually a full disk. Unlike the two figures above these are known-lost with certainty.</div></td></tr>
    <tr><td>Loss reported by transport</td><td>${fmtInt(s.messages_lost_reported)}
      <div class="caveat">Only what the transport chose to report. Observed reading 0 while messages were genuinely absent, so it is not a guarantee.</div></td></tr>
    <tr><td>Files written</td><td>${s.bag_splits + 1}</td></tr>
    <tr><td>Size on disk</td><td>${fmtBytes(s.bag_size_bytes)}
      <div class="caveat">Bytes flushed to disk, not bytes captured. Reads low early on because the writer buffers.</div></td></tr>
    <tr><td>Snapshot mode</td><td>${s.snapshot_mode ? "on" : "off"}</td></tr>`;
}

function render(s) {
  state = s;
  $("target").textContent = s.connected
    ? `${s.recorder} — ${s.uri || "no bag"}` : `waiting for ${s.recorder}`;
  const h = health(s);
  $("dot").className = "dot " + h.cls;
  $("health").textContent = h.text;
  $("health-note").textContent = h.note;

  const on = s.connected && s.recording;
  // When stopped, the only useful action is starting again -- so swap the button rather than
  // leaving a row of dead controls and no way forward.
  $("btn-record").hidden = !s.connected || s.recording;
  $("btn-record").disabled = busy;
  for (const id of ["btn-pause", "btn-split", "btn-snapshot", "btn-stop"]) {
    $(id).hidden = s.connected && !s.recording;
  }
  $("btn-pause").textContent = s.paused ? "Resume" : "Pause";
  for (const [id, ok] of [["btn-pause", on], ["btn-split", on],
                          ["btn-snapshot", on && s.snapshot_mode], ["btn-stop", on]]) {
    $(id).disabled = !ok || busy;
  }
  $("btn-snapshot").title = s.snapshot_mode
    ? "Flush the buffer to disk" : "Only available when the recorder runs in snapshot mode";

  if (!s.connected) {
    $("stats").innerHTML = "";
    $("topics").innerHTML = '<li class="empty">Waiting for the recorder…</li>';
    $("detail").innerHTML = "";
    $("profiles-card").hidden = true;
    return;
  }
  $("btn-apply").title = s.recording ? "" : "Start recording before changing topics";
  renderStats(s);
  renderProfiles(s);
  renderTopics(s);
  renderTimeline(s);
  renderEvents(s);
  renderDetail(s);
}

async function act(action, payload = {}) {
  busy = true;
  try {
    const res = await fetch("/api/action", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, ...payload }),
    });
    const out = await res.json();
    if (!out.ok) toast(out.error || "That did not work.");
    return out;
  } catch (err) {
    toast(`Could not reach the recorder: ${err}`);
    return { ok: false };
  } finally {
    busy = false;
    poll();
  }
}

async function poll() {
  try {
    render(await (await fetch("/api/state")).json());
  } catch {
    $("health").textContent = "Cannot reach the UI server";
    $("health-note").textContent = "The page is open but the node serving it is not responding.";
    $("dot").className = "dot bad";
  }
}

$("filter").addEventListener("input", () => { if (state) renderTopics(state); });
for (const [id, mode] of [["mode-text", "text"], ["mode-regex", "regex"]]) {
  $(id).onclick = () => {
    filterMode = mode;
    $("mode-text").setAttribute("aria-pressed", String(filterMode === "text"));
    $("mode-regex").setAttribute("aria-pressed", String(filterMode === "regex"));
    if (state) renderTopics(state);
  };
}
$("btn-match").onclick = async () => {
  const m = matcher();
  if (!m.ok || !m.query) return;
  // set_topics, not subscribe_topics: the button says "record all matching", and matching is
  // the whole selection. Topics in both the old and new sets are never torn down.
  const out = await act("set_topics", { topics: [], regex: m.query });
  if (out.ok) {
    pending = null;
    toast(`Recording ${(out.subscribed_topics || []).length} topics matching that pattern.`);
  }
};

$("btn-record").onclick = async () => {
  const out = await act("record");
  if (out.ok) toast("Recording into a new bag.");
};
$("btn-pause").onclick = () => act(state && state.paused ? "resume" : "pause");
$("btn-split").onclick = () => act("split_bagfile");
$("btn-snapshot").onclick = () => act("snapshot");
$("btn-stop").onclick = () => {
  if (confirm("Stop recording and close the bag? This cannot be undone.")) act("stop");
};
$("btn-apply").onclick = async () => {
  if (!pending) return;
  const topics = [...pending].sort();
  const out = await act("set_topics", { topics });
  if (out.ok) { pending = null; toast(`Now recording ${topics.length} topics.`); }
};

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
