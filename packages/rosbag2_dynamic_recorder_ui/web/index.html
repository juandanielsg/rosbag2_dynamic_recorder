<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recorder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Recording</h1>
  <div class="sub" id="target">connecting…</div>

  <div class="card">
    <div class="health">
      <span class="dot" id="dot"></span>
      <div>
        <div class="health-text" id="health">Looking for the recorder…</div>
        <div class="health-note" id="health-note"></div>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="card">
    <h2>Controls</h2>
    <div class="controls">
      <button id="btn-record" hidden>Start recording</button>
      <button id="btn-pause">Pause</button>
      <button id="btn-split">Start a new file</button>
      <button id="btn-snapshot">Save snapshot</button>
      <button id="btn-stop">Stop recording</button>
    </div>
    <div class="startbar" id="startbar" hidden>
      <input type="text" class="field" id="start-uri" autocomplete="off"
             placeholder="Bag path for the new recording (empty: next to the last one)"
             aria-label="Bag path for the new recording">
    </div>
  </div>

  <div class="card" id="schedule-card" hidden>
    <h2>Schedule</h2>
    <div class="schedbar">
      <select class="field" id="sched-action" aria-label="What to schedule"></select>
      <input type="text" class="field" id="sched-at" autocomplete="off"
             placeholder="+30s, 14:05 or 2026-10-01T14:05" aria-label="When">
      <select class="field" id="sched-mode" aria-label="Which clock">
        <option value="node">on a timer</option>
        <option value="publish">by publish time</option>
        <option value="receive">by receive time</option>
      </select>
      <select class="field" id="sched-topic" aria-label="Topic whose messages are checked"></select>
      <button id="btn-schedule">Schedule</button>
    </div>
    <p class="hint" id="sched-hint"></p>
    <ul class="schedules" id="schedules"></ul>
  </div>

  <div class="card" id="profiles-card" hidden>
    <h2>Profiles</h2>
    <div class="profiles" id="profiles"></div>
    <div class="pending" id="profile-note"></div>
  </div>

  <div class="card" id="timeline-card" hidden>
    <h2>Recording timeline</h2>
    <div class="tl" id="tl"></div>
    <div class="legend">
      <span><i class="swatch" style="background:var(--accent);opacity:.85"></i> recorded</span>
      <span><i class="swatch" style="background:var(--track)"></i> not recorded</span>
      <span><i class="swatch" style="background:var(--band)"></i> paused, every topic at once</span>
      <span><i class="swatch" style="width:2px;background:var(--fg);opacity:.55"></i> new file</span>
    </div>
    <p class="hint" id="tl-note"></p>
  </div>

  <div class="card">
    <h2>Topics</h2>
    <div class="filterbar">
      <input type="search" id="filter" placeholder="Filter topics…" autocomplete="off"
             aria-label="Filter topics">
      <div class="seg" role="group" aria-label="Filter mode">
        <button id="mode-text" aria-pressed="true">Text</button>
        <button id="mode-regex" aria-pressed="false">Regex</button>
      </div>
      <input type="search" class="field" id="exclude" placeholder="Except (regex)…"
             autocomplete="off" aria-label="Leave out topics matching" hidden>
      <button id="btn-add-match" disabled hidden>Add matching</button>
      <button id="btn-match" disabled hidden>Record only matching</button>
    </div>
    <ul class="topics" id="topics"><li class="empty">Waiting for topics…</li></ul>
    <div class="apply-row">
      <button class="primary" id="btn-apply" disabled>Apply changes</button>
      <span class="pending" id="pending"></span>
    </div>
    <p class="hint" id="filter-hint"></p>
  </div>

  <div class="card">
    <h2>Recent changes</h2>
    <ol class="events" id="events"><li class="empty">Nothing yet.</li></ol>
  </div>

  <details class="card">
    <summary>Details</summary>
    <table class="detail" id="detail"></table>
  </details>
</main>

<script src="app.js"></script>
</body>
</html>
